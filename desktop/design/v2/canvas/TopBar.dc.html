<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Шапка и вкладки рабочей области</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="/_blob/4a414078cb0b30a9f33cd7ff3f95b4b1">
<link rel="stylesheet" href="/_blob/91b098e33df1d5d3a71b967b3280aee7">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&amp;family=Roboto+Mono:wght@400;500&amp;family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,400,0,0&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div style="width: 100%; font-family: Roboto, sans-serif; color: #1B1B1F">
  <header style="height: 52px; display: flex; align-items: center; gap: 6px; padding: 0 12px 0 8px; background: #FFFFFF; box-sizing: border-box">
    <button class="ib" aria-label="Свернуть навигацию"><span class="ms" aria-hidden="true">side_navigation</span></button>
    <a href="/Start.dc.html" style="display: flex; align-items: center; gap: 8px; padding: 0 8px 0 2px; text-decoration: none; color: #1B1B1F" aria-label="SEOHEAD — к списку проектов">
      <svg width="24" height="24" viewBox="0 0 128 128" aria-hidden="true"><rect width="128" height="128" rx="30" fill="#1565C0"></rect><circle cx="56" cy="56" r="27" fill="none" stroke="#FFFFFF" stroke-width="13"></circle><path d="M77 77 L98 98" stroke="#FFFFFF" stroke-width="15" stroke-linecap="round"></path></svg>
      <span style="font: 700 15px Roboto, sans-serif; letter-spacing: .6px">SEOHEAD</span>
    </a>
    <div style="width: 1px; height: 24px; background: #DDE1E7; margin: 0 4px"></div>
    <button class="btn" style="border-color: transparent; padding: 0 8px; gap: 8px; height: 40px" aria-label="Выбрать проект">
      <span class="ms" aria-hidden="true" style="color: #45464F">workspaces</span>
      <span style="display: flex; flex-direction: column; align-items: flex-start; line-height: 1.2"><span style="font: 500 13px Roboto, sans-serif">Мебельный магазин</span><span style="font: 400 11px Roboto, sans-serif; color: #5D6069">shop.example.test · основной сайт</span></span>
      <span class="ms s18" aria-hidden="true" style="color: #6A6D76">expand_more</span>
    </button>
    <span class="ms s18" aria-hidden="true" style="color: #A3A7AF">chevron_right</span>
    <button class="btn" style="border-color: transparent; padding: 0 8px; gap: 8px; height: 40px" aria-label="Выбрать сохранённый запуск">
      <span class="ms" aria-hidden="true" style="color: #45464F">manage_search</span>
      <span style="display: flex; flex-direction: column; align-items: flex-start; line-height: 1.2"><span style="font: 500 13px Roboto, sans-serif">Скан №2 · r-0142</span><span style="font: 400 11px Roboto, sans-serif; color: #5D6069">07.10.2026 14:20 · 1 314 URL · частичный</span></span>
      <span class="ms s18" aria-hidden="true" style="color: #6A6D76">expand_more</span>
    </button>
    <div style="flex: 1"></div>
    <a class="b st-agent" href="/Modals.dc.html" title="Подключение агента" style="height: 28px; padding: 0 10px; border-radius: 14px; text-decoration: none"><span class="ms" aria-hidden="true">smart_toy</span>Агент · был 3 мин назад</a>
    <a class="btn" href="/Palette.dc.html" style="gap: 8px; color: #45464F; width: 220px; justify-content: flex-start"><span class="ms s18" aria-hidden="true">search</span><span style="font-weight: 400">Действия и переходы</span><span class="kbd" style="margin-left: auto">⌘K</span></a>
    <button class="ib" aria-label="Обновить данные проекта"><span class="ms" aria-hidden="true">refresh</span></button>
    <a class="btn pri" href="/ScanDialog.dc.html" style="padding: 0 14px 0 10px"><span class="ms" aria-hidden="true">play_arrow</span>Новый скан</a>
  </header>
  <div style="height: 36px; display: flex; align-items: flex-end; gap: 2px; padding: 0 8px; background: #F4F6FA; border-top: 1px solid #DDE1E7; border-bottom: 1px solid #DDE1E7; box-sizing: border-box" role="tablist" aria-label="Вкладки рабочей области">
    <sc-for list="{{tabs}}" as="t" hint-placeholder-count="4">
      <a class="{{t.cls}}" href="{{t.href}}" role="tab" aria-selected="{{t.on}}">
        <span class="ms s16" aria-hidden="true" style="color: {{t.color}}">{{t.icon}}</span>
        <span class="t">{{t.label}}</span>
        <span class="x" aria-label="Закрыть вкладку"><span class="ms s16" aria-hidden="true">close</span></span>
      </a>
    </sc-for>
    <a class="ib" href="/NewTab.dc.html" aria-label="Новая вкладка" style="width: 28px; height: 28px; margin: 0 0 3px 4px"><span class="ms s18" aria-hidden="true">add</span></a>
    <div style="flex: 1"></div>
    <a class="ib" href="/TabSettings.dc.html" aria-label="Настроить вкладки и панели" style="width: 28px; height: 28px; margin-bottom: 3px"><span class="ms s18" aria-hidden="true">tune</span></a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"tab":{"editor":"enum","options":["url","work","compare","issues","scans","inbox","reports","none"],"default":"url"},"label":{"editor":"text","default":""},"icon":{"editor":"text","default":"tab"},"$preview":{"width":1440,"height":88}}'>
class Component extends DCLogic {
  renderVals() {
    const active = this.props.tab ?? 'url';
    const tabs = [
      ['work', 'checklist', 'Работа · цель и задачи', '/Project.dc.html'],
      ['url', 'table_view', 'URL · скан №2', '/Main.dc.html'],
      ['compare', 'compare_arrows', 'Сравнение №1 → №2', '/Compare.dc.html'],
      ['issues', 'rule', 'Проблемы · 4xx', '/Issues.dc.html']
    ].map(([id, icon, label, href]) => ({
      icon, label, href, on: id === active,
      color: id === active ? '#1565C0' : '#6A6D76',
      cls: 'wtab' + (id === active ? ' on' : '')
    }));
    if (active === 'none' && this.props.label) tabs.push({ icon: this.props.icon || 'tab', label: this.props.label, href: ({ history: '/Scans.dc.html', inbox: '/Inbox.dc.html', terminal: '/Log.dc.html', find_in_page: '/Search.dc.html', description: '/Handoff.dc.html', menu_book: '/Methods.dc.html' })[this.props.icon] || '/Main.dc.html', on: true, color: '#1565C0', cls: 'wtab on' });
    return { tabs };
  }
}
</script>
</body>
</html>
