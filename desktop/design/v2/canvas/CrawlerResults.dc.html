<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Краулер · результаты</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="/_blob/4a414078cb0b30a9f33cd7ff3f95b4b1">

</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&amp;family=Roboto+Mono:wght@400;500&amp;family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,400,0,0&amp;display=swap">
<style>body{margin:0}
</style>
</helmet>
<div class="app" style="width: 1440px; height: 900px">
  <dc-import name="TopBar" mode="crawler" target="https://shop.example.test/" crawlState="Готово · 1 286 URL · 9 мин" hint-size="1440px,52px"></dc-import>
<div class="body">
  <dc-import name="SideNav" mode="crawler" active="crawler" h="822" hint-size="200px,822px"></dc-import>
  <div style="flex: 1; min-width: 0; display: flex; flex-direction: column; overflow: hidden">
  <div class="banner w"><span class="ms" aria-hidden="true">info</span><span style="flex: 1">Результат временный: без проекта нет истории, задач и сравнения сканов. Сохраните как проект, чтобы перепроверять исправления.</span></div>
  <div class="tabbar" role="tablist">
    <sc-for list="{{tabs}}" as="t" hint-placeholder-count="9"><button class="{{t.cls}}" role="tab" aria-selected="{{t.on}}" onClick="{{t.pick}}">{{t.label}}<span class="n">{{t.n}}</span></button></sc-for>
  </div>
  <div style="display: flex; align-items: center; gap: 8px; padding: 8px 12px; border-bottom: 1px solid #EEF0F3">
    <div class="fld" style="width: 320px; height: 30px"><span class="ms s18" aria-hidden="true" style="color: #6A6D76">filter_alt</span><input aria-label="Фильтр" placeholder="Фильтр по URL"></div>
    <button class="btn pill">Все<span class="ms s16" aria-hidden="true">expand_more</span></button>
    <div style="flex: 1"></div>
    <span style="font: 400 12px Roboto, sans-serif; color: #5D6069">{{tab.label}}: {{tab.n}}</span>
    <button class="btn pill"><span class="ms s16" aria-hidden="true">download</span>CSV</button>
  </div>
  <div class="main" style="overflow: hidden">
    <div class="thead" style="display: grid; grid-template-columns: {{grid}}"><sc-for list="{{tab.cols}}" as="c" hint-placeholder-count="4"><div class="th">{{c}}</div></sc-for></div>
    <sc-for list="{{rows}}" as="r" hint-placeholder-count="12">
      <div class="{{r.cls}}" onClick="{{r.pick}}" style="display: grid; grid-template-columns: {{grid}}">
        <div class="td mono" style="font-size: 12px"><span class="el">{{r.a}}</span></div><div class="td"><span class="el">{{r.b}}</span></div><div class="td"><span class="el">{{r.c}}</span></div><div class="td num">{{r.d}}</div>
      </div>
    </sc-for>
    <div style="flex: 1"></div>
  </div>
  </div>
</div>
  <footer class="status"><span>Краул без проекта · данные во временной папке до закрытия окна</span><div style="flex: 1"></div><span>Выбрано: {{selUrl}}</span></footer>
</div>
</x-dc>

}
</script>
</body>
</html>
