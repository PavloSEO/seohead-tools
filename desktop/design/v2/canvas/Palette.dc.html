<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Действия и переходы</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="/_blob/4a414078cb0b30a9f33cd7ff3f95b4b1">
<link rel="stylesheet" href="/_blob/91b098e33df1d5d3a71b967b3280aee7">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&amp;family=Roboto+Mono:wght@400;500&amp;family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,400,0,0&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div style="width: 1440px; height: 900px; position: relative; overflow: hidden">
  <dc-import name="Main" hint-size="1440px,900px"></dc-import>
  <div class="scrim" style="background: rgba(15,20,30,.22)"></div>
  <div class="dialog" role="dialog" aria-modal="true" aria-label="Действия и переходы" style="left: 400px; top: 110px; width: 640px; height: 520px; border-radius: 14px">
    <div style="height: 56px; display: flex; align-items: center; gap: 10px; padding: 0 16px; border-bottom: 1px solid #EEF0F3">
      <span class="ms" aria-hidden="true" style="color: #6A6D76">search</span>
      <input aria-label="Команда или адрес" value="{{q}}" onInput="{{onQ}}" placeholder="Команда, раздел или URL из скана…" style="flex: 1; border: 0; outline: 0; font: 400 16px Roboto, sans-serif; color: #1B1B1F">
      <span class="kbd">Esc</span>
    </div>
    <div style="flex: 1; overflow: hidden; padding: 6px 8px">
      <sc-for list="{{groups}}" as="g" hint-placeholder-count="3">
        <div class="sec" style="padding: 10px 10px 4px; margin: 0">{{g.title}}</div>
        <sc-for list="{{g.items}}" as="i" hint-placeholder-count="3">
          <a class="{{i.cls}}" href="{{i.href}}" onMouseEnter="{{i.hover}}"><span class="ms s18" aria-hidden="true" style="color: #45464F">{{i.icon}}</span><span style="flex: 1">{{i.label}}</span><span style="font: 400 12px Roboto, sans-serif; color: #6A6D76">{{i.hint}}</span><span class="kbd" style="margin-left: 8px">{{i.key}}</span></a>
        </sc-for>
      </sc-for>
    </div>
    <div style="height: 36px; display: flex; align-items: center; gap: 14px; padding: 0 16px; border-top: 1px solid #EEF0F3; font: 400 11px Roboto, sans-serif; color: #6A6D76">
      <span><span class="kbd">↑</span> <span class="kbd">↓</span> выбрать</span><span><span class="kbd">↵</span> открыть</span><span><span class="kbd">⌘↵</span> в новой вкладке</span>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { q: '', hi: 0 }; }
  renderVals() {
    const s = this.state;
    const all = [
      ['Действия', [['play_arrow', 'Новый скан', '', '⌘N', '/ScanDialog.dc.html'], ['format_list_bulleted', 'Скан по списку URL', '', '', '/ScanList.dc.html'], ['compare_arrows', 'Сравнить два скана', '', '', '/Compare.dc.html'], ['edit_note', 'Заметка агенту', '', '⌘⇧N', '/Inbox.dc.html'], ['description', 'Собрать отчёт для исполнителей', '', '', '/Handoff.dc.html']]],
      ['Разделы', [['checklist', 'Работа', 'цель и задачи', '⌘1', '/Project.dc.html'], ['table_view', 'URL', 'скан №2', '⌘2', '/Main.dc.html'], ['rule', 'Проблемы', '37', '⌘3', '/Issues.dc.html'], ['history', 'Сканы', '1 идёт', '⌘4', '/Scans.dc.html']]],
      ['URL в скане №2', [['link', '/catalog/chair-oak/', '200 · 1 240 мс', '', '/Main.dc.html'], ['link', '/missing/', '404', '', '/Main.dc.html'], ['link', '/blog/kak-vybrat-stul/', '200', '', '/Main.dc.html']]]
    ];
    const q = s.q.trim().toLowerCase();
    let n = 0;
    const groups = all.map(([title, items]) => ({ title, items: items.filter((x) => !q || x[1].toLowerCase().includes(q) || x[2].toLowerCase().includes(q)).map(([icon, label, hint, key, href]) => { const idx = n++; return { icon, label, hint, key, href, cls: 'mi' + (idx === s.hi ? ' on' : ''), hover: () => this.setState({ hi: idx }) }; }) })).filter((g) => g.items.length);
    return { q: s.q, onQ: (e) => this.setState({ q: e.target.value, hi: 0 }), groups };
  }
}
</script>
</body>
</html>
