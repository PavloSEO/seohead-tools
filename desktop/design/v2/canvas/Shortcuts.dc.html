<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Горячие клавиши</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="/_blob/c938fb19e1f0b2f77a9fb7cde6b9bc65">
<link rel="stylesheet" href="/_blob/91b098e33df1d5d3a71b967b3280aee7">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&amp;family=Roboto+Mono:wght@400;500&amp;family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,400,0,0&amp;display=swap">
<style>body{margin:0}
.kg{display:grid;align-content:start;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px 28px}
.kr{display:flex;align-items:center;gap:8px;height:28px;font:400 13px Roboto,sans-serif}
.kr span.t{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.key{display:inline-flex;align-items:center;justify-content:center;min-width:22px;height:22px;padding:0 5px;border:1px solid #C4C8D0;border-bottom-width:2px;border-radius:5px;background:#FFFFFF;font:500 12px Roboto,sans-serif;color:#1B1B1F;box-sizing:border-box}
.fake{height:32px;border-bottom:1px solid #EEF0F3;display:flex;align-items:center;padding:0 12px;gap:12px}
.fake i{display:block;height:8px;border-radius:4px;background:#E3E7EE}</style>
</helmet>
<div class="app" style="width: 1440px; height: 900px; position: relative">
<div aria-hidden="true" style="height: 88px; flex-shrink: 0; background: #FFFFFF; border-bottom: 1px solid #DDE1E7; display: flex; align-items: center; gap: 10px; padding: 0 16px 36px"><span class="ms" aria-hidden="true" style="color: #45464F">side_navigation</span><span style="font: 400 13px Roboto, sans-serif; color: #5D6069">Мебельный магазин · Скан №2</span></div>
<div class="body">
  <div aria-hidden="true" style="width: 200px; flex-shrink: 0; background: #F4F6FA; border-right: 1px solid #DDE1E7; padding: 14px 12px; box-sizing: border-box; display: flex; flex-direction: column; gap: 14px"><sc-for list="{{fake}}" as="f" hint-placeholder-count="8"><i style="display: block; height: 10px; width: {{f.b}}px; border-radius: 5px; background: #E3E7EE"></i></sc-for></div>
  <main class="main" aria-hidden="true">
    <div class="thead" style="height: 34px"></div>
    <sc-for list="{{fake}}" as="f" hint-placeholder-count="20"><div class="fake"><i style="width: {{f.a}}px"></i><i style="width: 60px"></i><i style="width: {{f.b}}px"></i></div></sc-for>
  </main>
</div>
<footer class="status"><span>1 314 URL</span></footer>
<div class="scrim"></div>
<div class="dialog anim-pop" role="dialog" aria-label="Горячие клавиши" style="left: 200px; top: 110px; width: 1040px; height: 680px">
  <div style="display: flex; align-items: center; gap: 12px; padding: 16px 20px; border-bottom: 1px solid #EEF0F3">
    <span class="ms" aria-hidden="true" style="color: #1565C0">keyboard</span>
    <h1 style="margin: 0; font: 500 18px Roboto, sans-serif; flex: 1">Горячие клавиши</h1>
    <div class="fld" style="width: 260px; height: 32px"><span class="ms s18" aria-hidden="true" style="color: #6A6D76">search</span><input aria-label="Найти сочетание" placeholder="Найти действие"></div>
    <a class="ib" href="/Main.dc.html" aria-label="Закрыть"><span class="ms" aria-hidden="true">close</span></a>
  </div>
  <div class="kg" style="flex: 1; padding: 18px 24px; overflow: hidden">
    <sc-for list="{{groups}}" as="g" hint-placeholder-count="6">
      <div><div class="sec">{{g.title}}</div>
        <sc-for list="{{g.items}}" as="k" hint-placeholder-count="5"><div class="kr"><span class="t">{{k.t}}</span><sc-for list="{{k.keys}}" as="x" hint-placeholder-count="2"><span class="key">{{x}}</span></sc-for></div></sc-for>
      </div>
    </sc-for>
  </div>
  <div style="display: flex; align-items: center; gap: 8px; padding: 12px 20px; border-top: 1px solid #EEF0F3; font: 400 12px Roboto, sans-serif; color: #5D6069">
    <span>Открыть этот список:</span><span class="key">⌘</span><span class="key">/</span><div style="flex: 1"></div>
    <a class="btn txt" href="/SetKeys.dc.html">Переназначить клавиши</a><a class="btn" href="/Help.dc.html">Справка</a>
  </div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    const G = [
      ['Общее', [['Действия и переходы', '⌘ K'], ['Настройки', '⌘ ,'], ['Справка', 'F1'], ['Эта шпаргалка', '⌘ /'], ['Новое окно', '⌘ ⇧ N']]],
      ['Сканы', [['Новый скан', '⌘ N'], ['Пауза / продолжить', '⌘ P'], ['Остановить скан', '⌘ .'], ['Перепроверить выбранные', '⌘ R'], ['Новая вкладка', '⌘ T']]],
      ['Вкладки и разделы', [['Работа', '⌘ 1'], ['Сканы', '⌘ 2'], ['URL', '⌘ 3'], ['Проблемы', '⌘ 4'], ['Закрыть вкладку', '⌘ W']]],
      ['Таблица', [['Фильтр', '⌘ F'], ['Следующая строка', '↓'], ['Открыть URL', '↵'], ['Копировать URL', '⌘ C'], ['Колонки', '⌘ ⇧ C']]],
      ['Задачи', [['Создать задачу из выбранных', '⌘ J'], ['Назначить исполнителя', 'A'], ['Отметить «Исправлено»', 'D'], ['Экспорт исполнителю', '⌘ E']]],
      ['Агент · С агентом', [['Входящие', '⌘ I'], ['Принять предложение', '⌘ ↵'], ['Отклонить', '⌘ ⌫'], ['Отключить MCP', '⌘ ⇧ M']]]
    ];
    const groups = G.map(([title, items]) => ({ title, items: items.map(([t, k]) => ({ t, keys: k.split(' ') })) }));
    const fake = Array.from({ length: 22 }, (_, i) => ({ a: 260 + (i * 53) % 300, b: 80 + (i * 37) % 120 }));
    return { groups, fake };
  }
}
</script>
</body>
</html>
