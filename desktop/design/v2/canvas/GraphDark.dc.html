<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Граф в тёмной теме</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="/_blob/c938fb19e1f0b2f77a9fb7cde6b9bc65">
<link rel="stylesheet" href="/_blob/91b098e33df1d5d3a71b967b3280aee7">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&amp;family=Roboto+Mono:wght@400;500&amp;family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,400,0,0&amp;display=swap">
<style>body{margin:0}
.dk{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 12px;border-radius:15px;border:1px solid #3A3F4A;background:#1E2128;color:#D7DAE0;font:500 12px Roboto,sans-serif;cursor:pointer}
.dk.on{background:#24364F;border-color:#9EC4F8;color:#CFE2FF}
</style>
</helmet>
<div style="width: 1440px; height: 900px; background: #16181D; font-family: Roboto, sans-serif; color: #E3E5EA; display: flex; flex-direction: column">
  <div style="display: flex; align-items: center; gap: 12px; padding: 18px 24px; border-bottom: 1px solid #2A2E37">
    <div style="font: 500 20px Roboto, sans-serif">Граф ссылок</div>
    <span style="font: 400 13px Roboto, sans-serif; color: #A9AEB8">Мебельный магазин · скан №2 · ссылки из контента</span>
    <div style="margin-left: auto; display: flex; gap: 8px">
      <sc-for list="{{modes}}" as="m" hint-placeholder-count="3"><button class="{{m.cls}}" onClick="{{m.pick}}">{{m.label}}</button></sc-for>
    </div>
  </div>
  <div style="flex: 1; min-height: 0; position: relative">
    <svg viewBox="0 0 1440 780" style="width: 100%; height: 100%" role="img" aria-label="Граф ссылок в тёмной теме">
      <g stroke="#3B4250" stroke-width="1">
        <line x1="720" y1="390" x2="470" y2="250"/><line x1="720" y1="390" x2="980" y2="230"/><line x1="720" y1="390" x2="1000" y2="540"/><line x1="720" y1="390" x2="440" y2="560"/><line x1="720" y1="390" x2="1230" y2="400"/>
        <line x1="470" y1="250" x2="360" y2="160"/><line x1="470" y1="250" x2="320" y2="290"/><line x1="470" y1="250" x2="520" y2="130"/><line x1="470" y1="250" x2="590" y2="300"/><line x1="360" y1="160" x2="320" y2="290"/>
        <line x1="980" y1="230" x2="1100" y2="140"/><line x1="980" y1="230" x2="1120" y2="270"/><line x1="980" y1="230" x2="900" y2="120"/><line x1="980" y1="230" x2="860" y2="290"/><line x1="1100" y1="140" x2="1120" y2="270"/>
        <line x1="1000" y1="540" x2="1110" y2="630"/><line x1="1000" y1="540" x2="900" y2="650"/><line x1="1000" y1="540" x2="1130" y2="500"/><line x1="1110" y1="630" x2="1130" y2="500"/>
        <line x1="440" y1="560" x2="330" y2="640"/><line x1="440" y1="560" x2="300" y2="510"/><line x1="440" y1="560" x2="540" y2="660"/><line x1="590" y1="300" x2="860" y2="290"/>
      </g>
      <g stroke="#9EC4F8" stroke-width="2.2" opacity="{{hl}}"><line x1="720" y1="390" x2="1000" y2="540"/><line x1="1000" y1="540" x2="1110" y2="630"/><line x1="1000" y1="540" x2="1130" y2="500"/><line x1="1000" y1="540" x2="900" y2="650"/></g>
      <circle cx="720" cy="390" r="24" fill="#9EC4F8"/>
      <circle cx="470" cy="250" r="16" fill="#7FB2F0"/><circle cx="980" cy="230" r="18" fill="#5ED0BE"/><circle cx="1000" cy="540" r="15" fill="#FFB86B" stroke="#FFE2BF" stroke-width="{{ring}}"/><circle cx="440" cy="560" r="12" fill="#7FB2F0"/><circle cx="1230" cy="400" r="10" fill="#A9AEB8"/>
      <circle cx="360" cy="160" r="7" fill="#7FB2F0"/><circle cx="320" cy="290" r="7" fill="#7FB2F0"/><circle cx="520" cy="130" r="6" fill="#7FB2F0"/><circle cx="590" cy="300" r="8" fill="#7FB2F0"/>
      <circle cx="1100" cy="140" r="8" fill="#5ED0BE"/><circle cx="1120" cy="270" r="7" fill="#5ED0BE"/><circle cx="900" cy="120" r="6" fill="#5ED0BE"/><circle cx="860" cy="290" r="7" fill="#5ED0BE"/>
      <circle cx="1110" cy="630" r="8" fill="#FFB86B"/><circle cx="900" cy="650" r="6" fill="#FFB86B"/><circle cx="1130" cy="500" r="7" fill="#FFB86B"/>
      <circle cx="330" cy="640" r="6" fill="#FF8A80"/><circle cx="300" cy="510" r="6" fill="#7FB2F0"/><circle cx="540" cy="660" r="5" fill="#7FB2F0"/>
      <circle cx="1320" cy="680" r="7" fill="#16181D" stroke="#FF8A80" stroke-width="2" stroke-dasharray="3 2"/><circle cx="140" cy="100" r="7" fill="#16181D" stroke="#FF8A80" stroke-width="2" stroke-dasharray="3 2"/>
      <g font-family="Roboto" font-size="13" fill="#E3E5EA"><text x="750" y="395">Главная</text><text x="492" y="240">Каталог</text><text x="1004" y="222">Товары</text><text x="1022" y="560" font-weight="500">Блог</text><text x="1248" y="404">Инфо</text><text x="1128" y="650">/blog/kak-vybrat-kuhnyu/</text></g>
    </svg>
    <div style="position: absolute; left: 24px; bottom: 20px; display: flex; gap: 16px; font: 400 12px Roboto, sans-serif; color: #A9AEB8"><span>узлов 1 314</span><span>рёбер 3 418</span><span>сирот 7</span><span>{{hint}}</span></div>
    <div style="position: absolute; right: 24px; bottom: 20px; font: 400 12px Roboto, sans-serif; color: #A9AEB8; max-width: 420px; text-align: right">Тёмная тема берёт цвета из токенов темы приложения: светлые тона разделов на фоне #16181D, контраст подписей не ниже 4,5:1</div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { mode: 'all' }; }
  renderVals() {
    const s = this.state;
    const modes = [['all', 'Весь сайт'], ['blog', 'Подсветить блог'], ['orph', 'Только проблемы']].map(([id, label]) => ({ label, cls: 'dk' + (s.mode === id ? ' on' : ''), pick: () => this.setState({ mode: id }) }));
    return { modes, hl: s.mode === 'blog' ? '1' : '0', ring: s.mode === 'blog' ? '4' : '0',
      hint: s.mode === 'orph' ? 'подсвечены сироты и ссылки на 4xx' : s.mode === 'blog' ? 'выделены связи блога: 4 ребра' : 'наведите на узел — соседи подсветятся' };
  }
}
</script>
</body>
</html>
