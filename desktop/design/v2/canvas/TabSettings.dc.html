<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Настройка вкладок и панелей</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="/_blob/4a414078cb0b30a9f33cd7ff3f95b4b1">
<link rel="stylesheet" href="/_blob/91b098e33df1d5d3a71b967b3280aee7">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&amp;family=Roboto+Mono:wght@400;500&amp;family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,400,0,0&amp;display=swap">
<style>body{margin:0}
.li{display:grid;grid-template-columns:24px 20px minmax(0,1fr) auto;gap:8px;align-items:center;height:38px;padding:0 8px;border-radius:8px;font:400 13px Roboto,sans-serif;cursor:pointer}
.li:hover{background:#F4F6FA}
.li.sel{background:#E3F0FF}
.seg{display:flex;background:#F4F6FA;border-radius:10px;padding:3px;gap:2px}
.seg button{flex:1;height:30px;border:0;border-radius:8px;background:transparent;font:500 12px Roboto,sans-serif;color:#45464F;cursor:pointer}
.seg button.on{background:#FFFFFF;color:#0B4A94;box-shadow:0 1px 2px rgba(10,20,40,.12)}
</style>
</helmet>
<div style="width: 1440px; height: 900px; position: relative; overflow: hidden">
  <div inert aria-hidden="true"><dc-import name="Main" hint-size="1440px,900px"></dc-import></div>
  <div class="scrim"></div>
  <div class="dialog" role="dialog" aria-modal="true" aria-labelledby="ts-t" style="left: 300px; top: 70px; width: 840px; height: 760px">
    <div style="height: 60px; display: flex; align-items: center; gap: 10px; padding: 0 12px 0 24px; border-bottom: 1px solid #EEF0F3">
      <h2 id="ts-t" style="margin: 0; font: 500 18px Roboto, sans-serif; flex: 1">Вкладки и панели</h2>
      <a class="ib" href="/Main.dc.html" aria-label="Закрыть"><span class="ms" aria-hidden="true">close</span></a>
    </div>
    <div class="tabbar" style="padding-left: 16px">
      <sc-for list="{{areas}}" as="a" hint-placeholder-count="3">
        <button class="{{a.cls}}" onClick="{{a.pick}}">{{a.label}}</button>
      </sc-for>
    </div>
    <div style="flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr) 260px; gap: 0">
      <div style="padding: 14px 18px; display: flex; flex-direction: column; gap: 8px; overflow: hidden">
        <label class="fld" style="height: 32px; color: #6A6D76"><span class="ms s18" aria-hidden="true">search</span><input aria-label="Найти вкладку" placeholder="Найти вкладку…"></label>
        <div style="font: 400 12px Roboto, sans-serif; color: #5D6069; padding: 4px 2px">Отмеченные показываются в этом порядке. Источник без данных покажет «Нет измерения», а не пустую таблицу.</div>
        <sc-for list="{{items}}" as="i" hint-placeholder-count="10">
          <div class="{{i.cls}}" onClick="{{i.pick}}">
            <input type="checkbox" checked="{{i.on}}" onChange="{{i.toggle}}" aria-label="{{i.label}}" style="width: 16px; height: 16px; margin: 0; accent-color: #1565C0">
            <span class="ms s18" aria-hidden="true" style="color: #6A6D76">{{i.icon}}</span>
            <span>{{i.label}}</span>
            <span class="{{i.availCls}}">{{i.avail}}</span>
          </div>
        </sc-for>
      </div>
      <div style="border-left: 1px solid #EEF0F3; background: #F7F8FB; padding: 14px 18px; display: flex; flex-direction: column; gap: 14px">
        <div class="sec" style="margin: 0">Порядок</div>
        <div style="display: flex; gap: 8px"><button class="btn" onClick="{{up}}"><span class="ms s18" aria-hidden="true">arrow_upward</span>Выше</button><button class="btn" onClick="{{down}}"><span class="ms s18" aria-hidden="true">arrow_downward</span>Ниже</button></div>
        <div class="hint" style="margin-top: -6px">Без перетаскивания: ⌥↑ / ⌥↓</div>
        <div class="sec" style="margin: 6px 0 0">Плотность таблиц</div>
        <div class="seg" role="radiogroup" aria-label="Плотность">
          <sc-for list="{{dens}}" as="d" hint-placeholder-count="3"><button class="{{d.cls}}" onClick="{{d.pick}}" role="radio" aria-checked="{{d.on}}">{{d.label}}</button></sc-for>
        </div>
        <div class="sec" style="margin: 6px 0 0">Панели</div>
        <label style="display: flex; gap: 8px; align-items: center; font: 400 13px Roboto, sans-serif"><input type="checkbox" checked style="accent-color: #1565C0; width: 16px; height: 16px; margin: 0">Сводка справа</label>
        <label style="display: flex; gap: 8px; align-items: center; font: 400 13px Roboto, sans-serif"><input type="checkbox" checked style="accent-color: #1565C0; width: 16px; height: 16px; margin: 0">Детали снизу</label>
        <label style="display: flex; gap: 8px; align-items: center; font: 400 13px Roboto, sans-serif"><input type="checkbox" style="accent-color: #1565C0; width: 16px; height: 16px; margin: 0">Детали справа (вариант B)</label>
        <div style="flex: 1"></div>
        <button class="btn txt" style="color: #45464F; justify-content: flex-start; padding: 0"><span class="ms s18" aria-hidden="true">restart_alt</span>Сбросить этот вид</button>
        <button class="btn txt" style="color: #B3261E; justify-content: flex-start; padding: 0"><span class="ms s18" aria-hidden="true">layers_clear</span>Сбросить все панели</button>
      </div>
    </div>
    <div style="height: 64px; display: flex; align-items: center; gap: 8px; padding: 0 24px; border-top: 1px solid #EEF0F3">
      <span class="hint" style="margin: 0">Данные проекта не меняются · только вид этого окна</span>
      <div style="flex: 1"></div>
      <a class="btn lg" href="/Main.dc.html" style="border-color: transparent">Отмена</a>
      <a class="btn lg pri" href="/Main.dc.html">Применить</a>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { area: 'bottom', sel: 1, dens: 'std',
      list: [['info', 'Сведения', true, 'есть'], ['call_received', 'Входящие ссылки', true, 'есть'], ['call_made', 'Исходящие ссылки', true, 'нет в ядре'], ['http', 'HTTP-заголовки', true, 'есть'], ['code', 'HTML', true, 'есть'], ['web', 'Rendered DOM', false, 'нужен JS-скан'], ['cookie', 'Cookies', false, 'не сохраняется'], ['preview', 'Сниппет', true, 'есть'], ['data_object', 'Schema', true, 'есть'], ['image', 'Изображения', false, 'есть'], ['rule', 'Проверки', true, 'есть'], ['fingerprint', 'Происхождение', true, 'есть']] };
  }
  renderVals() {
    const s = this.state;
    const areas = [['main', 'Основная таблица'], ['bottom', 'Детали URL'], ['right', 'Сводка справа']].map(([id, label]) => ({ label, cls: 'tab' + (id === s.area ? ' on' : ''), pick: () => this.setState({ area: id }) }));
    const items = s.list.map(([icon, label, on, avail], i) => ({ icon, label, on, avail, availCls: 'b ' + (avail === 'есть' ? 'mut' : 'warn'),
      cls: 'li' + (i === s.sel ? ' sel' : ''), pick: () => this.setState({ sel: i }),
      toggle: () => { const l = s.list.map((x) => x.slice()); l[i][2] = !l[i][2]; this.setState({ list: l }); } }));
    const mv = (d) => () => { const j = s.sel + d; if (j < 0 || j >= s.list.length) return; const l = s.list.slice(); [l[s.sel], l[j]] = [l[j], l[s.sel]]; this.setState({ list: l, sel: j }); };
    const dens = [['cmp', '28'], ['std', '32'], ['cmf', '40']].map(([id, label]) => ({ label, on: id === s.dens, cls: id === s.dens ? 'on' : '', pick: () => this.setState({ dens: id }) }));
    return { areas, items, dens, up: mv(-1), down: mv(1) };
  }
}
</script>
</body>
</html>
