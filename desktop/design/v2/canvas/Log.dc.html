<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Журнал</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="/_blob/c938fb19e1f0b2f77a9fb7cde6b9bc65">
<link rel="stylesheet" href="/_blob/91b098e33df1d5d3a71b967b3280aee7">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&amp;family=Roboto+Mono:wght@400;500&amp;family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,400,0,0&amp;display=swap">
<style>body{margin:0}
.ev{display:grid;grid-template-columns:76px 22px 120px minmax(0,1fr) 110px;gap:10px;align-items:center;min-height:34px;padding:0 16px;border-bottom:1px solid #EEF0F3;font:400 13px Roboto,sans-serif}
.ev:hover{background:#F5F8FD}
</style>
</helmet>
<div class="app" style="width: 1440px; height: 900px">
<dc-import name="TopBar" mode="agent" tab="none" label="Журнал" icon="terminal" hint-size="1440px,88px"></dc-import>
<div class="body">
  <dc-import name="SideNav" mode="agent" active="log" h="786" hint-size="200px,786px"></dc-import>
  <main class="main">
    <div style="height: 52px; flex-shrink: 0; display: flex; align-items: center; gap: 8px; padding: 0 16px 0 20px; border-bottom: 1px solid #EEF0F3">
      <h1 style="margin: 0; font: 500 16px Roboto, sans-serif">Журнал работы</h1>
      <div style="width: 12px"></div>
      <sc-for list="{{who}}" as="w" hint-placeholder-count="5">
        <button class="{{w.cls}}" onClick="{{w.pick}}"><span class="ms s16" aria-hidden="true">{{w.icon}}</span>{{w.label}}</button>
      </sc-for>
      <div style="flex: 1"></div>
      <label class="fld" style="width: 240px; height: 32px; color: #6A6D76"><span class="ms s18" aria-hidden="true">search</span><input aria-label="Поиск в журнале" placeholder="Поиск в журнале…"></label>
    </div>
    <sc-for list="{{rows}}" as="r" hint-placeholder-count="14">
      <div class="ev">
        <span class="tnum" style="color: #6A6D76; font-size: 12px">{{r.t}}</span>
        <span class="ms s18" aria-hidden="true" style="color: {{r.c}}">{{r.i}}</span>
        <span style="color: #45464F; font-size: 12px; font-weight: 500">{{r.who}}</span>
        <span style="min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap">{{r.text}}</span>
        <span class="mono" style="color: #6A6D76; font-size: 11px; text-align: right">{{r.ref}}</span>
      </div>
    </sc-for>
    <div style="flex: 1"></div>
    <div style="height: 34px; display: flex; align-items: center; padding: 0 16px; border-top: 1px solid #DDE1E7; font: 400 12px Roboto, sans-serif; color: #5D6069; gap: 8px"><span class="ms s16" aria-hidden="true" style="color: #7A4F00">warning</span>Показаны последние 200 событий: постраничное чтение журнала ещё не поддержано ядром<div style="flex: 1"></div><button class="btn pill"><span class="ms s16" aria-hidden="true">folder_open</span>Открыть папку логов</button></div>
  </main>
</div>
<footer class="status"><span>Обновлено 2 с назад</span></footer>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { who: 'all' }; }
  renderVals() {
    const E = [
      ['14:27:03', 'save', '#45464F', 'Скан r-0143', 'scan', 'checkpoint 400 URL · 146 МБ', 'r-0143'],
      ['14:26:51', 'error', '#B3261E', 'Скан r-0143', 'scan', '3 ответа 5xx на /api/* — повторы исчерпаны', 'r-0143'],
      ['14:25:40', 'smart_toy', '#1565C0', 'Агент', 'agent', 'Прочитал заметку «Футер ссылается на старые акции»', 'inbox-0030'],
      ['14:24:10', 'travel_explore', '#45464F', 'Скан r-0143', 'scan', 'Найдено 52 новых URL в /blog/', 'r-0143'],
      ['14:22:05', 'smart_toy', '#1565C0', 'Агент', 'agent', 'Перевёл задачу «Убрать ссылки на 404» в «Ждёт перепроверки»', 'T-118'],
      ['14:20:22', 'play_arrow', '#246B3C', 'Вы', 'me', 'Запустили скан по списку из 640 URL', 'r-0143'],
      ['14:05:12', 'flag', '#2E1F66', 'Агент', 'agent', 'Сверил задачи с целью проекта · 9 задач', 'inbox-0031'],
      ['14:02:00', 'edit_note', '#45464F', 'Вы', 'me', 'Предложили цель проекта', 'inbox-0031'],
      ['13:52:44', 'update', '#7A4F00', 'Импорт SF', 'scan', 'Нет статуса процесса SF 4 мин — помечено «устарело»', 'sf-0021'],
      ['13:40:02', 'bug_report', '#45464F', 'Импорт SF', 'scan', 'Запущен Screaming Frog CLI · профиль «Каталог»', 'sf-0021'],
      ['12:10:31', 'description', '#45464F', 'Агент', 'agent', 'Собрал отчёт для программиста · 4 задачи', 'report-07'],
      ['11:58:00', 'compare_arrows', '#45464F', 'Вы', 'me', 'Сравнили скан №1 и №2', 'r-0139 ↔ r-0142'],
      ['11:20:16', 'check_circle', '#246B3C', 'Агент', 'agent', 'Подтвердил задачу «Убрать ссылки на 404 в блоге» перепроверкой', 'T-105'],
      ['10:02:41', 'login', '#45464F', 'Приложение', 'app', 'Открыт проект «Мебельный магазин»', '7c1d…']
    ];
    const s = this.state.who;
    const who = [['all', 'apps', 'Все'], ['agent', 'smart_toy', 'Агент'], ['me', 'person', 'Вы'], ['scan', 'history', 'Сканы'], ['app', 'desktop_windows', 'Приложение']].map(([id, icon, label]) => ({ icon, label, cls: 'grp' + (id === s ? ' on' : ''), pick: () => this.setState({ who: id }) }));
    const rows = E.filter((e) => s === 'all' || e[4] === s).map(([t, i, c, w, k, text, ref]) => ({ t, i, c, who: w, text, ref }));
    return { who, rows };
  }
}
</script>
</body>
</html>
