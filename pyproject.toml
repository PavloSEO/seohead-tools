[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "seohead-desktop"
version = "0.1.0"
description = "Native SEOHEAD project-console preparation skeleton"
requires-python = ">=3.10"
dependencies = ["PyQt5==5.15.11", "mcp==1.29.0"]

[project.optional-dependencies]
build = ["pyinstaller>=6.16,<7"]

[project.scripts]
seohead-desktop = "seohead_desktop.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
seohead_desktop = ["theme/*.json", "theme/*.qss", "assets/icons/*", "assets/fonts/*", "assets/*.json", "fixtures/*.json"]
